# Regenerates data/ once a week: the current Kali year and one either side, for the exporter's
# default cities, with the jyotisha and adyatithi commits pinned in data-build.toml. Commits only
# when something changed. Can also be started by hand from the Actions tab.
name: Weekly data build

on:
  schedule:
    - cron: "17 21 * * 6"   # Saturday 21:17 UTC (Sunday 02:47 IST)
  workflow_dispatch:
    inputs:
      recompute_janma:
        description: "Recompute the janmadina tables (only after a change to how jyotisha places festivals)"
        type: boolean
        default: false
      add_city:
        description: "Add one city (an id from jyotisha's places table): build only it, into the data as it is"
        type: string
        default: ""
      issue:
        description: "The city-request issue to comment on and close (with add_city)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          p = tomllib.load(open("data-build.toml", "rb"))
          print(f"jyotisha={p['jyotisha']['commit']}")
          print(f"adyatithi={p['adyatithi']['commit']}")
          print(f"exporter_repo={p['adyatithi-panchaanga']['repository']}")
          print(f"exporter_ref={p['adyatithi-panchaanga']['ref']}")
          PY

      - uses: actions/checkout@v4
        with:
          repository: jyotisham/jyotisha
          ref: ${{ steps.pins.outputs.jyotisha }}
          path: deps/jyotisha

      - uses: actions/checkout@v4
        with:
          repository: jyotisham/adyatithi
          ref: ${{ steps.pins.outputs.adyatithi }}
          path: deps/adyatithi

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.exporter_repo }}
          ref: ${{ steps.pins.outputs.exporter_ref }}
          token: ${{ secrets.ADYATITHI_PANCHAANGA_TOKEN }}
          path: deps/adyatithi-panchaanga

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          # jyotisha reads its festival rules from this path.
          rm -rf deps/jyotisha/jyotisha/panchaanga/temporal/festival/data
          ln -s "$PWD/deps/adyatithi" deps/jyotisha/jyotisha/panchaanga/temporal/festival/data
          pip install pyswisseph astropy scipy pandas sanskrit_data indic_transliteration icalendar \
            convertdate pytz geocoder geopy numpy jsonpickle methodtools timebudget toml click doc-curation
          pip install --no-deps -e deps/jyotisha -e deps/adyatithi-panchaanga

      - name: Kali years
        id: years
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          t = datetime.date.today()
          # A Kali year begins at mesha sankranti, mid-April (5128 began in April 2026).
          k = t.year + 3102 if (t.month, t.day) >= (4, 14) else t.year + 3101
          print(f"years={k - 1},{k},{k + 1}")
          PY

      - name: Build
        if: inputs.add_city == ''
        env:
          PYTHONWARNINGS: ignore
        # The janmadina tables are kept from data/ (they change only with jyotisha's festival
        # engine); a new year or city gets one. Tick "Recompute" when starting by hand to redo all.
        run: >-
          adyatithi generate app-data --years ${{ steps.years.outputs.years }} --output-dir "$RUNNER_TEMP/data"
          --cities "$(grep -v '^#' data-cities.txt | paste -sd, -)"
          --janma-from data ${{ inputs.recompute_janma && '--recompute-janma' || '' }}
          > build.log 2>&1 || (tail -50 build.log; exit 1)

      # Adding a city: build it alone, straight into data/ (the index and text tables are merged),
      # and add it to data-cities.txt so that the weekly build keeps it.
      - name: Add city
        if: inputs.add_city != ''
        env:
          PYTHONWARNINGS: ignore
          CITY: ${{ inputs.add_city }}
          ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -qx "$CITY" data-cities.txt && { echo "$CITY is already built"; exit 0; }
          adyatithi generate app-data --years ${{ steps.years.outputs.years }} --cities "$CITY" --output-dir data --janma-from data > build.log 2>&1 || (tail -50 build.log; exit 1)
          echo "$CITY" >> data-cities.txt
          git add -A data data-cities.txt
          git config user.name "adyatithi data build"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add city $CITY${ISSUE:+ (#$ISSUE)}"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs --no-edit origin main
            [ "$i" = 3 ] && exit 1
          done
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Added: $CITY is now in the app (Kali ${{ steps.years.outputs.years }}), from the next publish, a few minutes from now."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Publish if changed
        if: inputs.add_city == ''
        run: |
          cp data/index.json "$RUNNER_TEMP/index.before.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/index.before.json"
          rsync -a --delete "$RUNNER_TEMP/data/" data/
          git add -A data
          # A new build date (and exporter commit) alone is not worth publishing.
          only_build_info=$(python3 - "$RUNNER_TEMP/index.before.json" data/index.json <<'PY'
          import json, sys
          a, b = (json.load(open(f)) for f in sys.argv[1:3])
          for x in (a, b):
              x.get("build", {}).pop("date", None)
              x.get("build", {}).pop("adyatithi_panchaanga", None)
          print("yes" if a == b else "no")
          PY
          )
          if git diff --cached --quiet -- . ':(exclude)data/index.json' && [ "$only_build_info" = "yes" ]; then
            git reset -q; git checkout -q -- data; echo "Nothing changed."; exit 0
          fi
          git config user.name "adyatithi data build"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Weekly data build ($(date -u +%F)): Kali ${{ steps.years.outputs.years }}"
          # A publish may have moved main while this ran (hours): take it in, keeping this build's data
          # where both touched a file, and try again.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs --no-edit origin main
          done
          exit 1
