# Publishes the site to GitHub Pages: the stable app from `main` at the root, and the nightly
# build from the `nightly` branch (when there is one) under nightly/. The calendar feeds
# (data/ics/…) are generated from main's data at publish time, so they are never committed (they
# come to about 100 MB across cities and scripts); the nightly app subscribes to those same feeds.
# Runs on every push to main, after each weekly data build (whose push does not trigger workflows
# by itself), and after each push to nightly (by way of the "Nightly pushed" workflow: the
# github-pages environment deploys only from main, and a workflow_run runs as main). Needs
# Settings → Pages → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Weekly data build", "Nightly pushed"]
    types: [completed]
  schedule:
    - cron: "43 4 * * 1"   # Mondays: the blog's posts (and the feeds' new month, if any)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # a nightly push right after a main one must not cancel it

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Nightly
        id: nightly
        run: |
          if git ls-remote --exit-code --heads origin nightly >/dev/null; then
            git fetch --depth 1 origin nightly
            mkdir -p "$RUNNER_TEMP/nightly"
            git --work-tree="$RUNNER_TEMP/nightly" checkout FETCH_HEAD -- .
            git reset -q
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Offline shell
        # Every module the app (and the nightly) loads must be in its service worker's list.
        run: |
          node tools/check_shell.mjs .
          if [ "${{ steps.nightly.outputs.present }}" = "yes" ]; then node tools/check_shell.mjs "$RUNNER_TEMP/nightly"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The feeds change only when the data, the feed script or the month does (a feed runs from the
      # start of the current year), so a cached copy is reused otherwise.
      - name: Feed key
        id: feedkey
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cached feeds
        id: feeds
        uses: actions/cache@v4
        with:
          path: data/ics
          key: ics-${{ steps.feedkey.outputs.month }}-${{ hashFiles('data/c/**', 'data/text/**', 'data/static/**', 'data/index.json', 'data/repos.json', 'tools/ics_feeds.py') }}
      - name: Calendar feeds
        if: steps.feeds.outputs.cache-hit != 'true'
        # tzdata carries the alias zones (US/Pacific …) the runner's system data no longer has.
        run: |
          pip install -q tzdata
          python tools/ics_feeds.py data
      - name: Blog
        # The Adyatithi blog's posts by section, for the app's blog page; skipped if unreadable.
        run: python tools/blog.py data/blog.json || echo "blog not read"
      - name: Site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude tools ./ "$RUNNER_TEMP/site/"
          if [ "${{ steps.nightly.outputs.present }}" = "yes" ]; then
            rsync -a --exclude .git --exclude .github --exclude tools --exclude data/ics \
              "$RUNNER_TEMP/nightly/" "$RUNNER_TEMP/site/nightly/"
          fi
          du -sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/site/nightly" 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
