# What the weekly data build (.github/workflows/data.yml) computes with. Change a commit here to
# move the app's data to a newer jyotisha or adyatithi; the build records the commits it used in
# data/index.json, so every published version of the data can be reproduced.

[jyotisha]
repository = "jyotisham/jyotisha"
# master, with the month-at-kaala (#209), bOdhAyana-amAvAsyA (#211) and places (#212–#214: Seattle, Thoothukudi) fixes.
commit = "1e05e88cdc3a88a4fec88e7b53117ce181c28b93"

[adyatithi]
repository = "jyotisham/adyatithi"
commit = "a3860a98cdfe1bc00e50b247d4d6fdc1e33009e2"

[adyatithi-panchaanga]
# The exporter. It lives in a private repository, read with the ADYATITHI_PANCHAANGA_TOKEN secret.
repository = "karthikraman/adyatithi-panchaanga"
ref = "main"
